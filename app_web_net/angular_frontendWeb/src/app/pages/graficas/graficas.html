<div class="pagina-graficas">
  <div class="tarjeta-graficas">
    <h3 class="titulo-graficas">Dashboard — Accesibilidad por Zona</h3>
    <p class="subtitulo-graficas">Campus UTL · Índice de Accesibilidad por Zona (IAZ)</p>

    @if (zonas().length > 0) {
      <app-mapa-calor [zonas]="zonas()"></app-mapa-calor>

      <div class="grid-graficas">
        <app-grafica-iaz [zonas]="zonas()"></app-grafica-iaz>
        <app-grafica-desglose [zonas]="zonas()"></app-grafica-desglose>
      </div>

      <app-interpretacion [zonas]="zonas()"></app-interpretacion>
    } @else {
      <p>Cargando datos de accesibilidad...</p>
    }
  </div>
</div>
