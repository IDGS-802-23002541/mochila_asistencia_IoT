<div class="main-content">

  <div class="page-body">

    <div class="nuevo-header">

      <div class="icono-dispositivo">
        📡
      </div>

      <div>
        <h2 class="section-title">
          Nuevo dispositivo
        </h2>

        <p class="subtitulo">
          Registra un nuevo dispositivo dentro del sistema Vision Guard.
        </p>
      </div>

    </div>



    <div class="form-card">


      @if(error){

      <div class="mensaje-error">
        ⚠ {{ error }}
      </div>

      }



      <div class="form-grid">


        <div class="form-group">

          <label>
            Organización
          </label>

          <div class="input-icon">

            <select
              [(ngModel)]="dispositivo.organizacionId">

              <option [ngValue]="0" disabled>
                Selecciona una organización
              </option>

              @for (org of organizaciones; track org.id) {
                <option [ngValue]="org.id">
                  {{ org.nombre }}
                </option>
              }

            </select>

          </div>

        </div>



        <div class="form-group">

          <label>
            MAC Address
          </label>

          <div class="input-icon">

            <input
              type="text"
              placeholder="24:0A:C4:8B:58:01"
              [(ngModel)]="dispositivo.macAddress">

          </div>

        </div>



        <div class="form-group">

          <label>
            Estado inicial
          </label>


          <div class="input-icon">

            <select
              [(ngModel)]="dispositivo.estado">

              <option value="Activo">
                Activo
              </option>

              <option value="Inactivo">
                Inactivo
              </option>

            </select>

          </div>


        </div>


      </div>




      <div class="acciones">


        <button
          class="btn-cancelar"
          (click)="cancelar()">

          Cancelar

        </button>



        <button
          class="btn-guardar"
          (click)="guardar()"
          [disabled]="guardando">


          {{ guardando ? 'Guardando...' : 'Guardar dispositivo' }}


        </button>


      </div>



    </div>


  </div>


</div>
