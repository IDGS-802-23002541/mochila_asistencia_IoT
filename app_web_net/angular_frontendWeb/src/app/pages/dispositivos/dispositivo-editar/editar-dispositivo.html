<div class="main-content">
  <div class="page-body">

    <div class="page-header">

      <div>
        <h2 class="section-title">
          Editar dispositivo
        </h2>

        <p class="section-subtitle">
          Actualiza la información del equipo registrado.
        </p>
      </div>

    </div>


    <div class="form-card">


      <div class="form-header">

        <div class="icon-device">
          📡
        </div>

        <div>

          <h3>
            Configuración del dispositivo
          </h3>

          <p>
            Modifica los datos necesarios para mantener actualizado el dispositivo.
          </p>

        </div>

      </div>


      @if(error){

      <div class="mensaje-error">

        ⚠ {{ error }}

      </div>

      }


      <div class="form-grid">


        <div class="form-group">

          <label>
            Organización
          </label>

          <select
          [(ngModel)]="dispositivo.organizacionId">

            <option [ngValue]="0" disabled>
              Selecciona una organización
            </option>

            @for (org of organizaciones; track org.id) {
              <option [ngValue]="org.id">
                {{ org.nombre }}
              </option>
            }

          </select>

        </div>



        <div class="form-group">

          <label>
            MAC Address
          </label>

          <input
          type="text"
          placeholder="24:0A:C4:8B:58:01"
          [(ngModel)]="dispositivo.macAddress">

        </div>



        <div class="form-group">

          <label>
            Estado del dispositivo
          </label>

          <select
          [(ngModel)]="dispositivo.estado">

            <option value="Activo">
              Activo
            </option>

            <option value="Inactivo">
              Inactivo
            </option>

          </select>

        </div>


      </div>



      <div class="acciones">


        <button
        class="btn-cancelar"
        (click)="cancelar()">

          Cancelar

        </button>



        <button
        class="btn-guardar"
        (click)="guardar()"
        [disabled]="guardando">

          {{ guardando ? 'Actualizando...' : 'Actualizar dispositivo' }}

        </button>


      </div>


    </div>


  </div>
</div>
